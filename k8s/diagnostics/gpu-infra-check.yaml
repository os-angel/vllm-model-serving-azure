apiVersion: v1
kind: Pod
metadata:
  name: gpu-infra-check
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    workload: gpu
  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  containers:
    - name: gpu-infra-check
      image: nvidia/cuda:12.8.1-base-ubuntu24.04
      env:
        - name: PATH
          value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64:/usr/local/nvidia/lib
      command:
        - /bin/sh
        - -c
      args:
        - /usr/local/nvidia/bin/nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader && df -h /
      resources:
        limits:
          nvidia.com/gpu: "1"
