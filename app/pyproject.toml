[project]
name = "nemotron-chat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.35.0",
  "openai==1.109.1",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "playwright==1.55.0",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
